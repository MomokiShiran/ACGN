name: Validate sites.json

on:
  pull_request:
    branches: ["master", "develop"]
    paths:
      - "src/data/sites.json"
      - "src/data/sitetrash.json"
      - "scripts/validate-sites.js"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sites.json validation
        run: npm run validate

      - name: Format check
        run: npm run format:check